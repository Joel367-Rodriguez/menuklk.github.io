<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-image: url(https://flo.health/cdn-cgi/image/quality=85,format=auto/uploads/media/sulu-750x-inset/09/1599-Fast%20food.jpg?v=1-0);
        background-repeat: no-repeat;
        background-size: cover;
        padding: 90px;
    }

    h1 {
        text-align: center;
        color: #000000;
    }

    .menu-container {
        width: 280px;
        background: white;
        margin: 0 auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .menu-item {
        display: flex;
        align-items: center;
        margin: 15px 0;
        font-size: 18px;
    }

    .menu-item input {
        width: 20px;
        height: 20px;
        margin-right: 12px;
        cursor: pointer;
    }

    label {
        cursor: pointer;
        color: #333;
    }

    label:hover {
        color: #1a73e8;
    }
</style>
</head>

<body>

<h1>Menú de Selección</h1>

<div class="menu-container">
    <center>
        <h2>Elige una o más comidas⬇</h2>
    </center>

    <div class="menu-item">
        <input type="checkbox" id="#">
        <label for="inicio">Pizza🍕</label>
    </div>

    <div class="menu-item">
        <input type="checkbox" id="#">
        <label for="servicios">Hamburguesa🍔</label>
    </div>

    <div class="menu-item">
        <input type="checkbox" id="#">
        <label for="productos">Hot-Dog🌭</label>
    </div>

    <div class="menu-item">
        <input type="checkbox" id="#">
        <label for="contacto">Pechurina🍗</label>
    </div>

    <div class="menu-item">
        <input type="checkbox" id="#">
        <label for="contacto">Papas Fritas🍟</label>
    </div>

    <div class="menu-item">
        <input type="checkbox" id="#">
        <label for="contacto">Helado🍨</label>
    </div>

</div>

</body>
</html>
